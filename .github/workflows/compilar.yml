name: Compilar 3DS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          apt-get update && apt-get install -y git build-essential cmake zip zlib1g-dev libpng-dev
          dkp-pacman -Sy --noconfirm 3ds-dev || true
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR /tmp/ctr
          (cd /tmp/ctr/makerom && make deps && make -j4 && cp bin/makerom /usr/local/bin/)
          git clone --depth 1 --recursive https://github.com/carstene1ns/3ds-bannertool /tmp/bt
          (cd /tmp/bt && cmake -B build . && cmake --build build -j4 && cp build/bannertool /usr/local/bin/)
      - name: Compilar
        working-directory: MiJuego-3ds
        run: |
          export DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitARM
          sh build-cia.sh
      - uses: actions/upload-artifact@v4
        with:
          name: juego-3ds
          path: |
            MiJuego-3ds/juego.cia
            MiJuego-3ds/MotorBloques3DS.3dsx
